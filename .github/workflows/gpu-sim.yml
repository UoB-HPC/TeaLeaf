name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA model and runs the ctest cases on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/cuda/**"
      - "driver/**"
      - "tests/**"
      - "Benchmarks/tea_bm_1.in"
      - "tea.problems"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda:
    name: CUDA 13.0 on simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # compute_90 embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DMODEL=cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
            -DCUDA_ARCH=compute_90 \
            -DCUDA_EXTRA_FLAGS="-cudart shared"

      - name: Build
        run: cmake --build build -j3

      # The reference, CLI override, multichunk, end_time and upstream input
      # solution cases use 10x10 or 64x64 cell decks, not the benchmark decks.
      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure --no-tests=error
